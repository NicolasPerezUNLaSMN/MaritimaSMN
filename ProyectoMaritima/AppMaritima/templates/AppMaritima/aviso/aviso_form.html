{% extends "AppMaritima/padre.html" %}


{% load static %}

        {% block contenido %}


        
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                         <div class="card">
                              <a href="{% url 'UltimoBoletin' %}" class="btn btn-primary">-Último boletín</a>
                            <div class="card-body">
                                <h4 class="card-title" data-bs-toggle="tooltip" data-bs-placement="top" title="{{tooltip}}">Crear un nuevo aviso</h4>
                        
                                <form method="POST">
                                    {% csrf_token %}


                                    {{form.as_ul}}
                        <!-- Mapa para selección de áreas -->
                                    <div id="map" style="width: 100%; height: 500px; margin-top: 20px;"></div>
                                

                                <input class="btn btn-success" type="submit" value="Enviar" />

                                </form>

                                

                            </div>
                        </div>

                    </div>
                </div>
            </div>

<!-- Tu template HTML del formulario (donde se muestra el mapa) -->

<!-- Incluir la hoja de estilo de Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<!-- Incluir el script de Leaflet.js -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Incluir el plugin de Leaflet para cargar archivos KML -->
<script src="https://unpkg.com/leaflet-omnivore@0.3.0/leaflet-omnivore.min.js"></script>

<!-- Estilo para el mapa (asegurarse que tenga un tamaño definido) -->
<style>
    #map {
        height: 600px;  /* Ajusta la altura según lo necesario */
    }
</style>

<!-- Aquí va el contenedor del mapa -->
<div id="map"></div>

<script>
    // Configuración de Leaflet
    var map = L.map('map').setView([-34.6037, -58.3816], 12); // Coordenadas de ejemplo (Buenos Aires)

    // Capa base de OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Cargar el archivo KML
    var kmlLayer = omnivore.kml('staticfiles/kml/mapa_metarea.kml') // Ruta al archivo KML
        .on('ready', function() {
            map.fitBounds(kmlLayer.getBounds());  // Ajustar el mapa al área del KML
        })
        .addTo(map);

    // Eventos de clic en las áreas
    kmlLayer.eachLayer(function (layer) {
        layer.on('click', function() {
            var areaName = layer.feature.properties.name;  // Nombre del área (según el KML)
            alert('Área seleccionada: ' + areaName);  // Mostrar nombre o hacer alguna acción
        });
    });
</script>





        {% endblock %}
